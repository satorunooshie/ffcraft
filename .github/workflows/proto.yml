name: Protobuf contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  buf:
    name: Buf lint and breaking change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download tool modules
        working-directory: tools
        run: go mod download
      - name: Lint protobufs
        working-directory: tools
        run: go tool buf lint ..
      - name: Check protobuf compatibility
        working-directory: tools
        run: go tool buf breaking --against '../.git#branch=main' ..
