name: Protobuf contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  buf:
    name: Buf lint and breaking change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf breaking --against '.git#branch=main'
