version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ffcompile
    main: ./cmd/ffcompile
    binary: ffcompile
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: ffcodegen
    main: ./cmd/ffcodegen
    binary: ffcodegen
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: ffcompile
    ids:
      - ffcompile
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: ffcodegen
    ids:
      - ffcodegen
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
