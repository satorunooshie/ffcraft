version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ffcompile
    main: ./cmd/ffcompile
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: ffcodegen
    main: ./cmd/ffcodegen
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
