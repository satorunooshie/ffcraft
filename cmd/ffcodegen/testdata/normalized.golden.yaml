flags:
    enable-new-home:
        environments:
            prod:
                base:
                    default_action:
                        serve: "off"
                    rules:
                        - action:
                            serve: "on"
                          condition:
                            equality:
                                attribute:
                                    segments:
                                        - user
                                        - id
                                literal:
                                    int_value: "1"
                                operator: EQUALITY_OPERATOR_EQ
        variants:
            "off":
                bool_value: false
            "on":
                bool_value: true
version: normalized/v1
