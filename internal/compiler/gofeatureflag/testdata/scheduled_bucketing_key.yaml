version: v1
variant_sets:
  boolean:
    on: true
    off: false
distributions:
  half_on:
    stickiness: user.id
    weights:
      on: 50
      off: 50
flags:
  - key: scheduled-distribution
    variant_set: boolean
    default_variant: off
    environments:
      prod:
        default_action:
          serve: off
        scheduled_rollouts:
          - date: "2026-05-01T00:00:00Z"
            default_action:
              distribute: half_on
