version: v1
variant_sets:
  boolean:
    on: true
    off: false
flags:
  - key: schedule-normalization
    variant_set: boolean
    default_variant: off
    environments:
      prod:
        default_action:
          serve: off
        scheduled_rollouts:
          - date: "2026-01-01T00:00:00Z"
            default_action:
              serve: off
          - date: "2026-02-01T00:00:00Z"
            default_action:
              serve: on
          - date: "2026-03-01T00:00:00Z"
            default_action:
              serve: on
          - date: "2026-04-01T00:00:00Z"
            default_action:
              serve: off
