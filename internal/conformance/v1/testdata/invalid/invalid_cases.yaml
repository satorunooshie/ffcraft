version: conformance/v1
cases:
  - name: duplicate_mapping_key
    input: |
      flags:
        example:
          variants:
            on:
              bool_value: true
            on:
              bool_value: false
          environments:
            prod:
              base:
                default_action:
                  serve: on
      version: normalized/v1
  - name: custom_yaml_tag
    input: |
      flags:
        example:
          variants:
            on:
              bool_value: !custom true
          environments:
            prod:
              base:
                default_action:
                  serve: on
      version: normalized/v1
  - name: unsupported_version
    input: |
      flags: {}
      version: normalized/v0
  - name: empty_extension_namespace
    input: |
      flags:
        example:
          variants:
            on:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  serve: on
      extensions:
        "":
          string_value: invalid
      version: normalized/v1
  - name: invalid_scalar_hex_for_int64
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              int_value: 0x10
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_scalar_leading_zero_for_int64
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              int_value: 01
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_scalar_yes_for_bool
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: yes
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_scalar_on_for_bool
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: ON
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_date_for_int64
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              int_value: 2026-01-01
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_decimal_for_int64
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              int_value: 1.25
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_exponent_for_int64
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              int_value: 1.25e1
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_empty_object_field_name
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              object_value:
                "":
                  string_value: invalid
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_missing_condition_oneof
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: true
          environments:
            prod:
              base:
                rules:
                  - condition: {}
                    action:
                      serve: value
                default_action:
                  serve: value
  - name: invalid_distribution_unknown_variant
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  distribute:
                    allocation_key:
                      segments: [user, id]
                    weights:
                      missing: 1
  - name: invalid_distribution_single_entry
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  distribute:
                    allocation_key:
                      segments: [user, id]
                    weights:
                      value: 1
  - name: invalid_distribution_zero_weight
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            off:
              bool_value: false
            on:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  distribute:
                    allocation_key:
                      segments: [user, id]
                    weights:
                      off: 0
                      on: 1
  - name: invalid_distribution_floating_point_weight
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            off:
              bool_value: false
            on:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  distribute:
                    allocation_key:
                      segments: [user, id]
                    weights:
                      off: 0.5
                      on: 1.0
  - name: invalid_semver_literal
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            off:
              bool_value: false
            on:
              bool_value: true
          environments:
            prod:
              base:
                rules:
                  - condition:
                      semver_comparison:
                        operator: SEM_VER_COMPARISON_OPERATOR_GTE
                        attribute:
                          segments: [app, version]
                        semver: not-semver
                    action:
                      serve: on
                default_action:
                  serve: off
  - name: invalid_heterogeneous_membership
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            off:
              bool_value: false
            on:
              bool_value: true
          environments:
            prod:
              base:
                rules:
                  - condition:
                      membership:
                        attribute:
                          segments: [value]
                        literals:
                          values:
                            - string_value: one
                            - int_value: 1
                    action:
                      serve: on
                default_action:
                  serve: off
  - name: invalid_duplicate_schedule_timestamp
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            off:
              bool_value: false
            on:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  serve: off
              schedule:
                - effective_at: "2026-01-01T00:00:00Z"
                  evaluation:
                    default_action:
                      serve: on
                - effective_at: "2026-01-01T00:00:00+00:00"
                  evaluation:
                    default_action:
                      serve: off
  - name: invalid_double_nan
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              double_value: .nan
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_double_infinity
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              double_value: .inf
          environments:
            prod:
              base:
                default_action:
                  serve: value
  - name: invalid_oversized_extension_namespace
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              bool_value: true
          environments:
            prod:
              base:
                default_action:
                  serve: value
      extensions:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: 
          string_value: invalid
  - name: invalid_oversized_object_field_name
    input: |
      version: normalized/v1
      flags:
        example:
          variants:
            value:
              object_value:
                fields:
                  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: 
                    string_value: invalid
          environments:
            prod:
              base:
                default_action:
                  serve: value
